<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Rápido de Saúde | Dra. Raiana Vicente</title>
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .quiz-container {
      max-width: 600px;
      margin: 60px auto;
      perspective: 1000px;
    }
    .quiz-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: transform 0.6s ease, opacity 0.4s ease;
      transform-style: preserve-3d;
    }
    .quiz-step {
      display: none;
      opacity: 0;
      transform: rotateX(-10deg);
      transition: all 0.5s ease;
    }
    .quiz-step.active {
      display: block;
      opacity: 1;
      transform: rotateX(0deg);
    }
    h2 {
      color: #2c3e50;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    .options button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin: 12px 0;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: background 0.3s, transform 0.2s;
    }
    .options button:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    .btn-voltar {
      display: inline-block;
      margin-bottom: 20px;
      color: #6c757d;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-voltar:hover {
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <a href="index.html" class="btn-voltar">&larr; Voltar para a página inicial</a>
    
    <div class="quiz-card" id="quizCard">
      <!-- Pergunta 1 -->
      <div class="quiz-step active" data-step="1">
        <h2>Como você avalia a sua disposição e energia no dia a dia?</h2>
        <div class="options">
          <button onclick="nextStep(1, 'otima')">Ótima, realizo minhas tarefas bem</button>
          <button onclick="nextStep(1, 'atencao')">Cansaço frequente no fim do dia</button>
          <button onclick="nextStep(1, 'preocupante')">Fadiga constante que limita atividades</button>
        </div>
      </div>

      <!-- Pergunta 2 -->
      <div class="quiz-step" data-step="2">
        <h2>Com que frequência realiza exames de rotina preventivos?</h2>
        <div class="options">
          <button onclick="nextStep(2, 'alta')">Anualmente em dia</button>
          <button onclick="nextStep(2, 'moderada')">De vez em quando</button>
          <button onclick="nextStep(2, 'baixa')">Faz muito tempo que não faço</button>
        </div>
      </div>

      <!-- Tela de Diagnóstico / Resultado -->
      <div class="quiz-step" data-step="resultado">
        <h2>Resultado do Teste Preliminar</h2>
        <p id="resultadoTexto" style="line-height: 1.6; color: #555;"></p>
        <button onclick="resetQuiz()" style="margin-top: 20px; background: #2c3e50; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer;">Refazer Teste</button>
      </div>
    </div>
  </div>

  <script>
    let respostasUsuario = {};

    function nextStep(stepAtual, resposta) {
      respostasUsuario['pergunta' + stepAtual] = resposta;
      const card = document.getElementById('quizCard');
      
      card.style.transform = 'rotateX(15deg)';
      
      setTimeout(() => {
        document.querySelector(`.quiz-step[data-step="${stepAtual}"]`).classList.remove('active');
        
        let proximoPasso = stepAtual + 1;
        let elementoProximo = document.querySelector(`.quiz-step[data-step="${proximoPasso}"]`);
        
        if (elementoProximo) {
          elementoProximo.classList.add('active');
        } else {
          document.querySelector('.quiz-step[data-step="resultado"]').classList.add('active');
          gerarDiagnostico();
        }
        
        card.style.transform = 'rotateX(0deg)';
      }, 300);
    }

    function gerarDiagnostico() {
      const textoRes = document.getElementById('resultadoTexto');
      
      if (respostasUsuario.pergunta1 === 'preocupante' || respostasUsuario.pergunta2 === 'baixa') {
        textoRes.innerHTML = "Notamos que alguns pontos merecem atenção e acompanhamento preventivo. O cuidado especializado é fundamental para garantir longevidade com qualidade de vida. Recomendamos agendar uma avaliação detalhada.";
      } else {
        textoRes.innerHTML = "Seu panorama indica bons hábitos de autocuidado. Continue mantendo seus exames e rotinas preventivas em dia para preservar seu bem-estar!";
      }
    }

    function resetQuiz() {
      respostasUsuario = {};
      document.querySelectorAll('.quiz-step').forEach(step => step.classList.remove('active'));
      document.querySelector('.quiz-step[data-step="1"]').classList.add('active');
    }
  </script>
</body>
</html>
